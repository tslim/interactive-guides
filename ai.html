uto;overflow:visible}.stage{margin-bottom:var(--s-5)}}\n\u003c/style\u003e\u003cstyle\u003emain{padding-top:var(--s-5);padding-bottom:var(--s-5)}html{overflow-y:hidden}body{margin:0}.series{margin-bottom:var(--s-3)}\u003c/style\u003e\u003c/head\u003e\u003cbody\u003e\n\u003csvg width=\"0\" height=\"0\" aria-hidden=\"true\" style=\"position:absolute\"\u003e\u003cdefs\u003e\u003cmarker id=\"agent-arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"6\" markerHeight=\"6\" orient=\"auto-start-reverse\"\u003e\u003cpath d=\"M0 0 10 5 0 10Z\" fill=\"context-stroke\"/\u003e\u003c/marker\u003e\u003c/defs\u003e\u003c/svg\u003e\n\u003cmain\u003e\n\u003cheader\u003e\u003cdiv class=\"eyebrow\"\u003eFrom prediction to action\u003c/div\u003e\u003ch1\u003eThe model proposes.\u003cbr\u003eThe harness acts.\u003c/h1\u003e\u003cp class=\"lead\"\u003eAn agent combines a model with tools and a control loop. The harness runs that loop, supplies context and controls execution.\u003c/p\u003e\u003c/header\u003e\n\u003cfigure\u003e\u003cdiv class=\"overview\" role=\"img\" aria-label=\"The harness sends context to a model. The model requests a tool. The harness checks and executes the request, then returns the result for the next model call.\"\u003e\u003cdiv class=\"box\"\u003e\u003csmall\u003eHarness supplies\u003c/small\u003eGoal + context\u003c/div\u003e\u003cdiv class=\"arrow\"\u003e\u003cspan class=\"verb\"\u003esend\u003c/span\u003e\u003cspan\u003e→\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"box focus\"\u003e\u003csmall\u003eModel generates\u003c/small\u003eReply or tool call\u003c/div\u003e\u003cdiv class=\"arrow\"\u003e\u003cspan class=\"verb\"\u003echeck\u003c/span\u003e\u003cspan\u003e→\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"box\"\u003e\u003csmall\u003eHarness executes\u003c/small\u003eAllowed tools\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"return-rail\"\u003e\u003cspan\u003e← return tool results as context for the next model call\u003c/span\u003e\u003c/div\u003e\u003cfigcaption\u003e\u003cspan class=\"mono\"\u003eFig. 1\u003c/span\u003eThe agent loop surrounds the token-generation loop from Part 1.\u003c/figcaption\u003e\u003c/figure\u003e\n\u003cnav class=\"tabs\" role=\"tablist\" aria-label=\"Guide views\"\u003e\u003cbutton role=\"tab\" id=\"tab-system\" aria-controls=\"system\" aria-selected=\"true\" tabindex=\"0\" data-tab=\"system\"\u003e1. The system\u003csmall\u003eWhat does each part do?\u003c/small\u003e\u003c/button\u003e\u003cbutton role=\"tab\" id=\"tab-loop\" aria-controls=\"loop\" aria-selected=\"false\" tabindex=\"-1\" data-tab=\"loop\"\u003e2. The loop\u003csmall\u003eStep through a task\u003c/small\u003e\u003c/button\u003e\u003cbutton role=\"tab\" id=\"tab-context\" aria-controls=\"context\" aria-selected=\"false\" tabindex=\"-1\" data-tab=\"context\"\u003e3. The context\u003csmall\u003eWhat can the model see?\u003c/small\u003e\u003c/button\u003e\u003c/nav\u003e\n\u003cnoscript\u003eEnable JavaScript for the interactive guide. The model generates replies or tool requests. The harness checks requests, runs allowed tools and returns results. Skills provide task instructions. MCP connects hosts to external capabilities. Memory files affect a model call only when relevant content is loaded into context.\u003c/noscript\u003e\n\u003csection id=\"system\" class=\"panel\" role=\"tabpanel\" aria-labelledby=\"tab-system\"\u003e\u003cdiv class=\"workspace\"\u003e\u003cdiv class=\"parts\" aria-label=\"Select a system component\"\u003e\u003cbutton data-part=\"model\" aria-pressed=\"false\"\u003eModel\u003csmall\u003eGenerate a reply or request\u003c/small\u003e\u003c/button\u003e\u003cbutton data-part=\"harness\" aria-pressed=\"true\"\u003eHarness\u003csmall\u003eRun and control the system\u003c/small\u003e\u003c/button\u003e\u003cbutton data-part=\"tool\" aria-pressed=\"false\"\u003eTool call\u003csmall\u003eRequest an operation\u003c/small\u003e\u003c/button\u003e\u003cbutton data-part=\"skill\" aria-pressed=\"false\"\u003eSkill\u003csmall\u003eLoad a task procedure\u003c/small\u003e\u003c/button\u003e\u003cbutton data-part=\"mcp\" aria-pressed=\"false\"\u003eMCP\u003csmall\u003eConnect to capabilities\u003c/small\u003e\u003c/button\u003e\u003cbutton data-part=\"subagent\" aria-pressed=\"false\"\u003eSubagent\u003csmall\u003eDelegate a bounded task\u003c/small\u003e\u003c/button\u003e\u003c/div\u003e\u003cdiv class=\"detail\" id=\"system-detail\" aria-live=\"polite\"\u003e\u003c/div\u003e\u003c/div\u003e\u003c/section\u003e\n\u003csection id=\"loop\" class=\"panel\" role=\"tabpanel\" aria-labelledby=\"tab-loop\" hidden\u003e\n\u003cdiv class=\"scenario\"\u003e\u003cdiv class=\"user-message\"\u003e\u003cspan class=\"micro\"\u003eUSER MESSAGE\u003c/span\u003e\u003cp\u003e“Read issue #42, find a documented workaround, and add a short summary comment.”\u003c/p\u003e\u003c/div\u003e\u003cfieldset class=\"scenario-controls\"\u003e\u003clegend\u003eRun conditions\u003c/legend\u003e\u003clabel\u003e\u003cinput type=\"checkbox\" id=\"require-approval\" checked\u003e Approve writes\u003c/label\u003e\u003clabel\u003e\u003cinput type=\"checkbox\" id=\"fail-once\"\u003e Fail first read\u003c/label\u003e\u003clabel\u003e\u003cinput type=\"checkbox\" id=\"no-rag-matches\"\u003e No RAG matches\u003c/label\u003e\u003c/fieldset\u003e\u003cdiv class=\"micro\"\u003eSIMULATION ONLY · no model, network request or external change\u003c/div\u003e\u003c/div\u003e\n\u003cdiv class=\"agent-loop-layout\"\u003e\u003cfigure class=\"stage\"\u003e\u003cdiv class=\"loop-strip\" aria-label=\"Agent control loop\"\u003e\u003cdiv data-loop-node=\"context\"\u003eContext\u003c/div\u003e\u003cspan aria-hidden=\"true\"\u003e→\u003c/span\u003e\u003cdiv data-loop-node=\"model\"\u003eModel\u003c/div\u003e\u003cspan aria-hidden=\"true\"\u003e→\u003c/span\u003e\u003cdiv data-loop-node=\"gate\"\u003eGate\u003c/div\u003e\u003cspan aria-hidden=\"true\"\u003e→\u003c/span\u003e\u003cdiv data-loop-node=\"tool\"\u003eTool\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"return-rail\"\u003e← append result, then call the model again\u003c/div\u003e\u003cdiv id=\"event-log\" class=\"event-log\" role=\"log\" aria-label=\"Visible calls and results\" aria-live=\"polite\"\u003e\u003c/div\u003e\u003cfigcaption\u003e\u003cspan class=\"mono\"\u003eFig. 3\u003c/span\u003eThese are visible requests and results, not private model reasoning.\u003c/figcaption\u003e\u003c/figure\u003e\u003cdiv class=\"stage\"\u003e\u003cspan class=\"status\" id=\"loop-status\"\u003eREADY\u003c/span\u003e\u003ch2 id=\"loop-title\"\u003eStart with a goal.\u003c/h2\u003e\u003cp id=\"loop-text\"\u003eThe harness assembles instructions, the user task and tool definitions. No tool has run.\u003c/p\u003e\u003cdiv id=\"rag-evidence\" class=\"callout\" hidden aria-live=\"polite\"\u003e\u003c/div\u003e\u003cdiv id=\"loop-outcome\" class=\"note\" aria-live=\"polite\"\u003eExternal change: none.\u003c/div\u003e\u003cdiv class=\"loop-actions\"\u003e\u003cbutton id=\"loop-next\" class=\"primary\"\u003eCall model →\u003c/button\u003e\u003cbutton id=\"approve\" hidden\u003eApprove write\u003c/button\u003e\u003cbutton id=\"deny\" hidden\u003eDeny write\u003c/button\u003e\u003cbutton id=\"loop-stop\" disabled\u003eStop\u003c/button\u003e\u003cbutton id=\"loop-reset\"\u003eReset\u003c/button\u003e\u003c/div\u003e\u003cp class=\"note\"\u003eReset to change the scenario. Each model call generates tokens; tool execution is a separate operation.\u003c/p\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cdetails\u003e\u003csummary\u003eWhere is RAG in this loop?\u003c/summary\u003e\u003cp\u003eRAG means retrieval-augmented generation: retrieve relevant passages, add them to context, then generate a response using them. Here, knowledge.search is an ordinary tool call. Other systems retrieve automatically before calling the model.\u003c/p\u003e\u003cdiv class=\"smallgrid\"\u003e\u003cdiv\u003e\u003cstrong\u003eRetrieve\u003c/strong\u003e\u003cspan\u003eQuery → permitted document passages\u003c/span\u003e\u003c/div\u003e\u003cdiv\u003e\u003cstrong\u003eAdd context\u003c/strong\u003e\u003cspan\u003ePassages + source IDs → model input\u003c/span\u003e\u003c/div\u003e\u003cdiv\u003e\u003cstrong\u003eGenerate\u003c/strong\u003e\u003cspan\u003eEvidence → proposed comment with a citation\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003cfigure\u003e\u003cdiv class=\"smallgrid\" style=\"grid-template-columns:repeat(2,minmax(0,1fr))\"\u003e\u003cdiv\u003e\u003cstrong\u003eToken embeddings · inside the LLM\u003c/strong\u003e\u003cspan\u003eToken ID → learned vector → Transformer layers\u003c/span\u003e\u003c/div\u003e\u003cdiv\u003e\u003cstrong\u003eRetrieval embeddings · search\u003c/strong\u003e\u003cspan\u003eQuery or passage → encoder → vector for similarity search\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003cfigcaption\u003eBoth use vectors, but they serve different purposes. A search embedding is not a token-table lookup.\u003c/figcaption\u003e\u003c/figure\u003e\u003cp\u003eRetrieval often uses a separate embedding model. Query and passage vectors must use compatible encoders. The selected passage text usually enters the generative LLM’s context—not the search vectors themselves.\u003c/p\u003e\u003cp\u003eA search index is prepared separately. Retrieval can use keywords, embeddings or both, with optional reranking. It does not require MCP or fine-tuning. A citation helps check a claim; it does not prove that a workaround works.\u003c/p\u003e\u003cp\u003eTry “No RAG matches”: the model reports the gap instead of inventing a source. All results and decisions in this demo are scripted.\u003c/p\u003e\u003c/details\u003e\u003cdetails\u003e\u003csummary\u003eWhat stops a real agent?\u003c/summary\u003e\u003cp\u003eA final reply, user cancellation, permission denial, unrecoverable error, or a runtime limit can stop a run. Limits may cover time, cost, tokens and tool calls. Stopping a run does not undo completed actions.\u003c/p\u003e\u003cp\u003eRetries need care: after a write timeout, the action may already have succeeded. Check its status or use an idempotency key before trying again.\u003c/p\u003e\u003c/details\u003e\n\u003c/section\u003e\n\u003csection id=\"context\" class=\"panel\" role=\"tabpanel\" aria-labelledby=\"tab-context\" hidden\u003e\u003cdiv class=\"context-layout\"\u003e\u003cdiv class=\"stage\"\u003e\u003ch2\u003eAvailable is not the same as loaded.\u003c/h2\u003e\u003cp class=\"intro muted\"\u003eThe harness selects what enters each model call. Try adding a skill, a result and a saved note.\u003c/p\u003e\u003cdiv class=\"context-controls\"\u003e\u003clabel\u003e\u003cinput type=\"checkbox\" id=\"ctx-skill\"\u003e Load skill instructions\u003c/label\u003e\u003clabel\u003e\u003cinput type=\"checkbox\" id=\"ctx-result\"\u003e Include tool result\u003c/label\u003e\u003clabel\u003e\u003cinput type=\"checkbox\" id=\"ctx-memory\"\u003e Retrieve saved memory\u003c/label\u003e\u003chr\u003e\u003clabel\u003e\u003cinput type=\"checkbox\" id=\"ctx-compact\"\u003e Compact old conversation\u003c/label\u003e\u003clabel\u003e\u003cinput type=\"checkbox\" id=\"ctx-excerpt\" disabled\u003e Keep only a result excerpt\u003c/label\u003e\u003c/div\u003e\u003cdiv class=\"outside\"\u003e\u003cspan class=\"micro\"\u003eOUTSIDE THIS MODEL CALL\u003c/span\u003e\u003cp\u003eFiles · databases · old sessions · unloaded skills\u003c/p\u003e\u003cspan class=\"note\"\u003eRead or retrieve → select content → include in context\u003c/span\u003e\u003c/div\u003e\u003cdetails\u003e\u003csummary\u003eDoes this change the model’s weights?\u003c/summary\u003e\u003cp\u003eNo. Context, saved notes and tool results change the input, not the weights. A KV cache reuses computation for a prefix; it is not durable task memory. Saved memory must be loaded again when needed.\u003c/p\u003e\u003c/details\u003e\u003c/div\u003e\u003cfigure class=\"stage\"\u003e\u003cdiv class=\"budget-heading\"\u003e\u003ch2\u003eA context window is finite.\u003c/h2\u003e\u003cspan class=\"status\" id=\"context-status\"\u003eFITS\u003c/span\u003e\u003c/div\u003e\u003cdiv class=\"micro\" id=\"context-meter-label\"\u003e\u003c/div\u003e\u003cdiv class=\"context-meter\" id=\"context-meter\" role=\"img\"\u003e\u003c/div\u003e\u003cdiv id=\"context-items\" class=\"context-items\"\u003e\u003c/div\u003e\u003cdiv class=\"context-advice\" id=\"context-advice\" aria-live=\"polite\"\u003e\u003c/div\u003e\u003cfigcaption\u003e\u003cspan class=\"mono\"\u003eFig. 4\u003c/span\u003eBlocks are illustrative capacity units, not actual token counts. Output space is reserved in this toy budget.\u003c/figcaption\u003e\u003c/figure\u003e\u003c/div\u003e\u003cdiv class=\"trust-note\"\u003e\u003cstrong\u003eTool output is data, not authority.\u003c/strong\u003e\u003cp\u003eA page or file can contain hostile instructions. Keep source boundaries, limit tool access and enforce permissions outside the model.\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\n\u003cfooter\u003e\u003cdiv\u003e\u003cstrong\u003eSame model. More surrounding software.\u003c/strong\u003e\u003cbr\u003e\u003cspan class=\"footer-note\"\u003eCommon architecture, not a universal API. Product terms vary.\u003c/span\u003e\u003c/div\u003e\u003cdiv\u003eRead more\u003cbr\u003e\u003ca href=\"https://modelcontextprotocol.io/docs/learn/architecture\" target=\"_blank\" rel=\"noopener\"\u003eMCP\u003c/a\u003e\u003ca href=\"https://agentskills.io/what-are-skills\" target=\"_blank\" rel=\"noopener\"\u003eAgent Skills\u003c/a\u003e\u003ca href=\"https://www.anthropic.com/engineering/building-effective-agents\" target=\"_blank\" rel=\"noopener\"\u003eAgent patterns\u003c/a\u003e\u003c/div\u003e\u003c/footer\u003e\n\u003c/main\u003e\n\u003cscript\u003e\nconst one = s =\u003e document.querySelector(s);\nconst all = s =\u003e [...document.querySelectorAll(s)];\nconst esc = s =\u003e String(s).replaceAll('\u0026','\u0026amp;').replaceAll('\u003c','\u0026lt;').replaceAll('\u003e','\u0026gt;').replaceAll('\"','\u0026quot;');\nconst tabs = all('[data-tab]');\nfunction showTab(name){tabs.forEach(b=\u003e{const active=b.dataset.tab===name;b.setAttribute('aria-selected',active);b.tabIndex=active?0:-1;one('#'+b.dataset.tab).hidden=!active;});}\ntabs.forEach((b,i)=\u003e{b.onclick=()=\u003eshowTab(b.dataset.tab);b.onkeydown=e=\u003e{let n=i;if(e.key==='ArrowRight')n=(i+1)%tabs.length;else if(e.key==='ArrowLeft')n=(i+tabs.length-1)%tabs.length;else if(e.key==='Home')n=0;else if(e.key==='End')n=tabs.length-1;else return;e.preventDefault();showTab(tabs[n].dataset.tab);tabs[n].focus();};});\nfunction figure(body,caption){return '\u003cfigure\u003e'+body+'\u003cfigcaption\u003e\u003cspan class=\"mono\"\u003eFig. 2\u003c/span\u003e'+caption+'\u003c/figcaption\u003e\u003c/figure\u003e';}\nfunction svg(body,label){return '\u003cdiv class=\"scroll\"\u003e\u003csvg class=\"drawing\" viewBox=\"0 0 640 240\" role=\"img\" aria-label=\"'+esc(label)+'\"\u003e'+body+'\u003c/svg\u003e\u003c/div\u003e';}\nfunction node(x,y,w,title,sub='',hot=false){return `\u003crect x=\"${x}\" y=\"${y}\" width=\"${w}\" height=\"64\" rx=\"4\" class=\"${hot?'hot':''}\"/\u003e\u003ctext x=\"${x+12}\" y=\"${y+25}\"\u003e${title}\u003c/text\u003e\u003ctext class=\"sub\" x=\"${x+12}\" y=\"${y+47}\"\u003e${sub}\u003c/text\u003e`;}\nfunction edge(d,label,x,y,hot=false){return `\u003cpath class=\"edge ${hot?'hotedge':''}\" d=\"${d}\"/\u003e\u003ctext class=\"sub edge-label\" x=\"${x}\" y=\"${y}\"\u003e${label}\u003c/text\u003e`;}\nfunction codeBlock(text){return '\u003cpre\u003e\u003ccode\u003e'+esc(text)+'\u003c/code\u003e\u003c/pre\u003e';}\nlet toolView='call',skillLoaded=false,mcpMode=true,delegated=false;\nconst toolExamples={definition:{label:'Definition · supplied by the harness',code:{name:'issues.get',description:'Read an issue by its numeric ID.',input_schema:{type:'object',properties:{id:{type:'integer'}},required:['id']}},caption:'A name, description and input schema tell the model how to request the operation.'},call:{label:'Request · generated by the model',code:{type:'tool_call',call_id:'read_1',name:'issues.get',arguments:{id:42}},caption:'The model emits structured data. The harness must validate it before execution.'},result:{label:'Result · returned by the tool via the harness',code:{type:'tool_result',call_id:'read_1',content:{id:42,title:'Export fails on empty rows',status:'open'}},caption:'The call ID links a result to its request. The next model call can use that result.'}};\nconst components={\nmodel:()=\u003e`\u003ch2\u003eA tool request is still model output.\u003c/h2\u003e\u003cp class=\"intro\"\u003eThe model generates tokens from its input. A tool-enabled interface can expose part of that output as a structured request.\u003c/p\u003e${figure(svg(edge('M152 106H247','generate',173,88,true)+edge('M405 106H484','choose',418,88)+node(0,74,152,'Context','task + tools')+node(253,74,152,'Model','weights fixed',true)+node(490,74,148,'Output','reply / call'),'Context enters the model, which generates a reply or a structured tool request.'),'Generating a tool call does not execute it.')}\u003cp class=\"note\"\u003eThe model does not gain direct access to files or services. The surrounding software supplies results from permitted operations.\u003c/p\u003e\u003cdetails\u003e\u003csummary\u003eWhere is the “agent”?\u003c/summary\u003e\u003cp\u003eIn this guide, the agent is the combined system: model, context, tools and a loop that can select the next action. A model call is one step within that system.\u003c/p\u003e\u003c/details\u003e`,\nharness:()=\u003e`\u003ch2\u003eThe harness turns output into a controlled action.\u003c/h2\u003e\u003cp class=\"intro\"\u003eThe harness is the runtime around the model. It manages context, tool execution, state, approvals and stop conditions.\u003c/p\u003e${figure('\u003cdiv class=\"harness-boundary\"\u003e\u003cdiv class=\"micro\"\u003eHARNESS / RUNTIME\u003c/div\u003e\u003cdiv class=\"gate-grid\"\u003e\u003cdiv\u003e\u003cspan class=\"micro\"\u003eRECEIVE\u003c/span\u003e\u003cstrong\u003eParse request\u003c/strong\u003e\u003cspan\u003eTool name + arguments\u003c/span\u003e\u003c/div\u003e\u003cdiv\u003e\u003cspan class=\"micro\"\u003eCHECK\u003c/span\u003e\u003cstrong\u003eApply policy\u003c/strong\u003e\u003cspan\u003eSchema, access, approval\u003c/span\u003e\u003c/div\u003e\u003cdiv\u003e\u003cspan class=\"micro\"\u003eEXECUTE\u003c/span\u003e\u003cstrong\u003eRun allowed tool\u003c/strong\u003e\u003cspan\u003eScope, timeout, sandbox\u003c/span\u003e\u003c/div\u003e\u003cdiv\u003e\u003cspan class=\"micro\"\u003eCONTINUE\u003c/span\u003e\u003cstrong\u003eAppend result\u003c/strong\u003e\u003cspan\u003eCall model or stop\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003cdiv class=\"return-rail\"\u003e← repeat while the task and runtime limits allow\u003c/div\u003e\u003c/div\u003e','A request passes through software controls before a tool can change the outside world.')}\u003cp class=\"note\"\u003eA prompt such as “be careful” is not a permission boundary. A reliable harness also enforces restrictions in code.\u003c/p\u003e\u003cdetails\u003e\u003csummary\u003eHarness vs. framework vs. agent\u003c/summary\u003e\u003cp\u003eA framework provides building blocks. A harness is the working runtime that connects them. An agent uses that runtime to carry out a goal. Products use these names differently.\u003c/p\u003e\u003c/details\u003e`,\ntool:()=\u003e`\u003ch2\u003eA tool call has a contract and a result.\u003c/h2\u003e\u003cp class=\"intro\"\u003eA tool is an operation exposed by software: read a file, query a service, run a test or make a change.\u003c/p\u003e\u003cdiv class=\"controls\"\u003e${['definition','call','result'].map(v=\u003e`\u003cbutton data-tool-view=\"${v}\" aria-pressed=\"${toolView===v}\"\u003e${{definition:'Definition',call:'Request',result:'Result'}[v]}\u003c/button\u003e`).join('')}\u003c/div\u003e${figure('\u003cdiv class=\"micro\"\u003e'+toolExamples[toolView].label+'\u003c/div\u003e'+codeBlock(JSON.stringify(toolExamples[toolView].code,null,2)),toolExamples[toolView].caption)}\u003cp class=\"note\"\u003eIllustrative message shape; APIs differ. The harness must reject unknown tools, invalid inputs and disallowed actions. A valid schema does not grant permission.\u003c/p\u003e\u003cdetails\u003e\u003csummary\u003eDoes every result mean success?\u003c/summary\u003e\u003cp\u003eNo. Results can contain application errors, timeouts or incomplete data. The model should use the returned evidence, not assume that the requested action succeeded.\u003c/p\u003e\u003c/details\u003e`,\nskill:()=\u003e`\u003ch2\u003eA skill supplies a reusable procedure.\u003c/h2\u003e\u003cp class=\"intro\"\u003eA skill packages task instructions, often with reference files or scripts. Loading it gives the model more guidance, not new weights.\u003c/p\u003e\u003cdiv class=\"controls\"\u003e\u003cbutton data-skill=\"false\" aria-pressed=\"${!skillLoaded}\"\u003eBefore loading\u003c/button\u003e\u003cbutton data-skill=\"true\" aria-pressed=\"${skillLoaded}\"\u003eLoad skill\u003c/button\u003e\u003c/div\u003e${figure('\u003cdiv class=\"skill-flow\"\u003e\u003cdiv class=\"file-sheet\"\u003e\u003cdiv class=\"micro\"\u003eSKILL PACKAGE · ON DISK\u003c/div\u003e\u003cstrong\u003eissue-summary/\u003c/strong\u003e\u003ccode\u003eSKILL.md\u003cbr\u003ereferences/style.md\u003cbr\u003escripts/check.py\u003c/code\u003e\u003c/div\u003e\u003cdiv class=\"transfer\"\u003e'+(skillLoaded?'read → include':'available ≠ loaded')+'\u003c/div\u003e\u003cdiv class=\"file-sheet '+(skillLoaded?'selected':'')+'\"\u003e\u003cdiv class=\"micro\"\u003eMODEL CONTEXT\u003c/div\u003e\u003cstrong\u003eUser task + tool schemas\u003c/strong\u003e'+(skillLoaded?'\u003col\u003e\u003cli\u003eRead the issue and retrieve relevant guidance.\u003c/li\u003e\u003cli\u003eDraft a factual summary with source IDs.\u003c/li\u003e\u003cli\u003eGet approval before posting.\u003c/li\u003e\u003c/ol\u003e':'\u003cp class=\"note\"\u003eAt most, a short skill description is available for discovery.\u003c/p\u003e')+'\u003c/div\u003e\u003c/div\u003e',skillLoaded?'Selected instructions enter context. Referenced files can be loaded only when needed.':'An installed skill does not have to fill every model call.')}\u003cp class=\"note\"\u003eA script bundled with a skill still needs a permitted execution tool. Instructions do not bypass harness policy.\u003c/p\u003e\u003cdetails\u003e\u003csummary\u003eIs every “skill” the same format?\u003c/summary\u003e\u003cp\u003eNo. Agent Skills is one open format that uses SKILL.md and optional supporting files. Other products use different conventions. A skill is not automatically an MCP server or a tool.\u003c/p\u003e\u003c/details\u003e`,\nmcp:()=\u003e`\u003ch2\u003eMCP connects the host to capabilities.\u003c/h2\u003e\u003cp class=\"intro\"\u003eModel Context Protocol (MCP) standardizes communication between a host’s client and a server. It does not run the agent loop.\u003c/p\u003e\u003cdiv class=\"controls\"\u003e\u003cbutton data-mcp=\"false\" aria-pressed=\"${!mcpMode}\"\u003eDirect integration\u003c/button\u003e\u003cbutton data-mcp=\"true\" aria-pressed=\"${mcpMode}\"\u003eVia MCP\u003c/button\u003e\u003c/div\u003e${figure(mcpMode?svg(edge('M166 105H246','MCP',189,88,true)+edge('M414 105H493','API',441,88)+node(0,73,166,'Host + client','harness side',true)+node(252,73,162,'MCP server','capabilities')+node(499,73,139,'Service','issue tracker')+'\u003ctext class=\"sub\" x=\"180\" y=\"188\"\u003e← return result through the same connection\u003c/text\u003e','A host with an MCP client calls an MCP server, which accesses an issue tracker and returns a result.'):svg(edge('M174 105H280','call',210,88,true)+edge('M446 105H510','API',461,88)+node(0,73,174,'Harness','owns agent loop',true)+node(286,73,160,'Custom adapter','integration code')+node(516,73,122,'Service','issues'),'A harness can use a custom adapter to call a service directly without MCP.'),mcpMode?'The server can run locally or remotely. It may expose tools, resources and prompt templates.':'Tools can work without MCP. A protocol is one integration choice.')}\u003cdiv class=\"smallgrid\"\u003e\u003cdiv\u003e\u003cstrong\u003eTools\u003c/strong\u003e\u003cspan\u003eCallable operations\u003c/span\u003e\u003c/div\u003e\u003cdiv\u003e\u003cstrong\u003eResources\u003c/strong\u003e\u003cspan\u003eReadable context data\u003c/span\u003e\u003c/div\u003e\u003cdiv\u003e\u003cstrong\u003ePrompts\u003c/strong\u003e\u003cspan\u003eReusable templates\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\u003cdetails\u003e\u003csummary\u003eDiscovery and trust\u003c/summary\u003e\u003cp\u003eAfter connection and initialization, an MCP client can discover tool definitions and invoke tools. The host supplies relevant definitions and results to the model. MCP uses JSON-RPC messages; supported features are negotiated.\u003c/p\u003e\u003cp\u003eStandard communication does not make a server or its content safe. Hosts still need authorization, scoped access and suitable approval controls.\u003c/p\u003e\u003c/details\u003e`,\nsubagent:()=\u003e`\u003ch2\u003eA subagent is another bounded agent run.\u003c/h2\u003e\u003cp class=\"intro\"\u003eThe parent delegates a task. A child uses selected context and tools, then returns a result. It is not an attention head.\u003c/p\u003e\u003cdiv class=\"controls\"\u003e\u003cbutton data-delegate=\"false\" aria-pressed=\"${!delegated}\"\u003eOne agent\u003c/button\u003e\u003cbutton data-delegate=\"true\" aria-pressed=\"${delegated}\"\u003eDelegate work\u003c/button\u003e\u003c/div\u003e${figure(delegated?svg(edge('M155 115H204V47H271','delegate',174,22,true)+edge('M204 115V175H271','delegate',174,207)+edge('M431 47H480V115H510','return',450,22)+edge('M431 175H480V115','return',450,207)+node(0,83,155,'Parent','goal + merge',true)+node(277,15,154,'Test agent','test results')+node(277,143,154,'Review agent','review findings')+node(516,83,122,'Parent','verify'),'A parent delegates independent test and review tasks, then verifies and merges returned results.'):svg(edge('M164 109H252','work',193,90,true)+edge('M420 109H502','continue',435,90)+node(0,77,164,'One agent','task context',true)+node(258,77,162,'Run tests','read results')+node(508,77,130,'Review','then report'),'One agent runs tests, reads results and reviews the change in one task context.'),delegated?'Independent tasks can run in parallel. Separate context does not imply a separate security sandbox.':'A single agent is often enough for a short, sequential task.')}\u003cp class=\"note\"\u003e${delegated?'Extra agents add model calls, coordination cost and possible errors. Verify their output with evidence; do not treat a summary as proof.':'Delegate when independent work or separate context helps—not just to add more agents.'}\u003c/p\u003e\u003cdetails\u003e\u003csummary\u003eAgent loop vs. fixed workflow\u003c/summary\u003e\u003cp\u003eA workflow follows routes set by code. An agent loop lets model output influence the next action. A system can combine both: fixed approval gates around model-selected tool calls.\u003c/p\u003e\u003c/details\u003e`\n};\nfunction renderPart(part){all('[data-part]').forEach(b=\u003eb.setAttribute('aria-pressed',b.dataset.part===part));one('#system-detail').innerHTML=components[part]();all('[data-tool-view]').forEach(b=\u003eb.onclick=()=\u003e{toolView=b.dataset.toolView;renderPart('tool');one(`[data-tool-view=\"${toolView}\"]`).focus();});all('[data-skill]').forEach(b=\u003eb.onclick=()=\u003e{skillLoaded=b.dataset.skill==='true';renderPart('skill');one(`[data-skill=\"${skillLoaded}\"]`).focus();});all('[data-mcp]').forEach(b=\u003eb.onclick=()=\u003e{mcpMode=b.dataset.mcp==='true';renderPart('mcp');one(`[data-mcp=\"${mcpMode}\"]`).focus();});all('[data-delegate]').forEach(b=\u003eb.onclick=()=\u003e{delegated=b.dataset.delegate==='true';renderPart('subagent');one(`[data-delegate=\"${delegated}\"]`).focus();});}\nall('[data-part]').forEach(b=\u003eb.onclick=()=\u003erenderPart(b.dataset.part));renderPart('harness');\nlet state='ready',attempts=0,posted=false,events=[],activeCall='',retrievedPassages=[];\nconst phaseInfo={ready:['READY','Start with a goal.','The harness assembles instructions, the user task and tool definitions. No tool has run.','context','Call model →'],read_call:['MODEL REQUEST','The model requests a read.','The model emits issues.get with an issue ID. The harness has not executed it.','model','Check read request →'],read_allowed:['READ ALLOWED','The gate permits this read.','The harness checks the schema, tool allowlist and access to issue #42. This read needs no approval in our example.','gate','Execute read →'],read_ok:['TOOL RESULT','The result becomes new context.','The harness appends the issue data and its call ID. Another model call can now use this evidence.','tool','Call model again →'],read_error:['TOOL ERROR','An error is also a result.','The read failed. The next model call sees the error and, in this scripted example, requests one retry.','tool','Call model to retry →'],rag_call:['RAG REQUEST','The model requests relevant passages.','Retrieval-augmented generation (RAG) adds retrieved evidence to the model input. Here, the model requests knowledge.search using the issue symptoms.','model','Check retrieval request →'],rag_allowed:['RETRIEVAL ALLOWED','The gate limits the search scope.','The harness validates the request. The retrieval service must enforce document access before returning passages.','gate','Retrieve passages →'],rag_ok:['RAG RESULT','Passages become evidence for generation.','The harness adds retrieved text and source IDs to context. The next model call can draft a comment using this evidence; retrieval does not change model weights.','tool','Call model to draft →'],write_call:['MODEL REQUEST','The model drafts with available evidence.','The model uses issue data and any retrieved passage to request issues.add_comment. No matches means no cited workaround. It does not claim to have tested a fix.','model','Check write request →'],approval:['AWAITING APPROVAL','Pause before the external change.','The harness requires approval for this exact comment on issue #42. The write cannot run while approval is pending.','gate',''],write_allowed:['WRITE ALLOWED','The harness can execute the write.','The tool and arguments passed policy checks. Required approval has been obtained, or this scenario permits the write without a prompt.','gate','Execute write →'],write_ok:['TOOL RESULT','The tool reports a completed write.','The result includes a comment ID. The harness appends it before asking the model for a final response.','tool','Call model for reply →'],denied:['WRITE DENIED','No comment was posted.','The harness returns a denial result. The model can report the blocked action; it must not claim success.','context','Call model for reply →'],done:['FINISHED','Report the observed outcome.','The model returns a final reply based on the tool results. The harness ends this run.','model',''],stopped:['STOPPED','The user stops the run.','The harness stops this simulation before the next operation. In a live system, in-flight actions may need separate cancellation.','gate','']};\nconst terminal=()=\u003e['done','stopped'].includes(state);\nfunction addEvent(actor,text){events.push({actor,text});}\nfunction invoke(next){state=next;return true;}\nfunction renderLoop(){const info=state==='rag_ok'\u0026\u0026!retrievedPassages.length?['NO RAG MATCHES','The search found no relevant passage.','The empty result enters context. The model should report this gap, not invent a source or a documented workaround.','tool','Call model to draft →']:phaseInfo[state];const evidence=one('#rag-evidence');evidence.hidden=state!=='rag_ok'||!retrievedPassages.length;evidence.innerHTML=retrievedPassages.map(p=\u003e`\u003cstrong\u003e${esc(p.source_id)} · ${esc(p.title)}\u003c/strong\u003e\u003cspan class=\"micro\"\u003e${esc(p.section)}\u003c/span\u003e\u003cp class=\"note\"\u003e“${esc(p.excerpt)}”\u003c/p\u003e`).join('');one('#loop-status').textContent=info[0];one('#loop-title').textContent=info[1];one('#loop-text').textContent=info[2];all('[data-loop-node]').forEach(n=\u003e{const active=n.dataset.loopNode===info[3];n.classList.toggle('active',active);if(active)n.setAttribute('aria-current','step');else n.removeAttribute('aria-current');});const next=one('#loop-next');next.textContent=info[4]||'Run ended';next.hidden=state==='approval';next.disabled=terminal();one('#approve').hidden=one('#deny').hidden=state!=='approval';one('#loop-stop').disabled=state==='ready'||terminal();one('#loop-outcome').textContent='External change: '+(posted?'one comment posted (simulated).':'none.');all('.scenario-controls input,.scenario-controls select').forEach(e=\u003ee.disabled=state!=='ready');const log=one('#event-log');log.innerHTML=events.length?events.map(e=\u003e`\u003cdiv class=\"event\"\u003e\u003cspan class=\"actor\"\u003e${esc(e.actor)}\u003c/span\u003e\u003ccode\u003e${esc(e.text)}\u003c/code\u003e\u003c/div\u003e`).join(''):'\u003cdiv class=\"empty-log\"\u003eStep through the loop to see tool requests, gate decisions and results.\u003c/div\u003e';log.scrollTop=log.scrollHeight;}\nfunction nextStep(){\n  if(terminal()||state==='approval')return;\n  switch(state){\n    case 'ready':\n    case 'read_error':\n      if(invoke('read_call')){\n        activeCall='read_'+(attempts+1);\n        addEvent('Model',JSON.stringify({call_id:activeCall,tool:'issues.get',arguments:{id:42}}));\n      }\n\n\n      break;\n    case 'read_call':\n      state='read_allowed';\n      addEvent('Harness','Valid schema. Read of issue #42 is allowed.');\n      break;\n    case 'read_allowed':\n      attempts++;\n      if(one('#fail-once').checked\u0026\u0026attempts===1){\n        state='read_error';\n        addEvent('Tool',JSON.stringify({call_id:activeCall,error:'Service temporarily unavailable',retryable:true}));\n      }else{\n        state='read_ok';\n        addEvent('Tool',JSON.stringify({call_id:activeCall,title:'Export fails on empty rows',status:'open',detail:'CSV export stops when it reaches an empty row.'}));\n      }\n      break;\n    case 'read_ok':\n      if(invoke('rag_call'))addEvent('Model',JSON.stringify({call_id:'rag_1',tool:'knowledge.search',arguments:{query:'CSV export stops on empty rows workaround',top_k:2}}));\n      break;\n    case 'rag_call':\n      state='rag_allowed';\n      addEvent('Harness','Valid query. Search only the knowledge-base documents this user may read.');\n      break;\n    case 'rag_allowed':\n      state='rag_ok';\n      retrievedPassages=one('#no-rag-matches').checked?[]:[{source_id:'KB-17',title:'CSV export troubleshooting',section:'Empty rows',excerpt:'If export stops on an empty row, remove empty rows from a copy of the source data and retry.'}];\n      addEvent('Tool',JSON.stringify({call_id:'rag_1',matches:retrievedPassages}));\n      addEvent('Harness',retrievedPassages.length?'Append the returned passage and its source ID to model context. Treat the passage as external data, not instructions.':'No relevant passages returned. Append the empty result; do not invent a source or workaround.');\n      break;\n    case 'rag_ok':\n      if(invoke('write_call'))addEvent('Model',JSON.stringify({call_id:'write_1',tool:'issues.add_comment',arguments:{id:42,body:ragComment()}}));\n      break;\n    case 'write_call':\n      state=one('#require-approval').checked?'approval':'write_allowed';\n      addEvent('Harness',state==='approval'?'Schema valid. Scoped write allowed only after approval.':'Schema valid. This scenario permits the scoped write without a prompt.');\n      break;\n    case 'write_allowed':\n      state='write_ok';posted=true;\n      addEvent('Tool',JSON.stringify({call_id:'write_1',ok:true,comment_id:907}));\n      break;\n    case 'wr <script>
const chapterSources=JSON.parse(document.getElementById('chapter-data').textContent);
const chapterIds=['llm','agents'];
const chapterButtons=[...document.querySelectorAll('[data-chapter]')];
const chapterFrames=Object.fromEntries(chapterIds.map(id=>[id,document.getElementById('frame-'+id)]));
const chapterObservers=[];
let activeChapter='llm';
function resizeChapter(id){
  const frame=chapterFrames[id];
  if(document.getElementById('chapter-'+id).hidden)return;
  const main=frame.contentDocument?.querySelector('main');
  if(!main)return;
  const height=Math.ceil(main.getBoundingClientRect().height)+2;
  if(height>0&&Math.abs(frame.getBoundingClientRect().height-height)>1)frame.style.height=height+'px';
  frame.contentWindow.scrollTo(0,0);
}
function selectChapter(id,{scroll=true,focus=false,updateHash=true}={}){
  if(!chapterIds.includes(id))return;
  activeChapter=id;
  document.getElementById('chapter-count').textContent=(chapterIds.indexOf(id)+1)+' / '+chapterIds.length;
  chapterIds.forEach(key=>{const active=key===id;document.getElementById('chapter-'+key).hidden=!active;const button=document.getElementById('chapter-tab-'+key);button.setAttribute('aria-selected',active);button.tabIndex=active?0:-1;});
  const chapterIndex=chapterIds.indexOf(id);
  const previous=document.getElementById('chapter-previous'),next=document.getElementById('chapter-next');
  previous.disabled=chapterIndex===0;next.disabled=chapterIndex===chapterIds.length-1;
  previous.textContent=chapterIndex===0?'← Previous':'← How LLMs work';
  next.textContent=chapterIndex===chapterIds.length-1?'End of guide':'How agents work →';
  document.getElementById('chapter-position').textContent=id==='llm'?'How LLMs work':'How agents work';
  document.getElementById('chapter-announcement').textContent=id==='llm'?'Chapter 1 of 2: How LLMs work':'Chapter 2 of 2: How agents work';
  document.title=(id==='llm'?'How LLMs work':'How agents work')+' — From tokens to agents';
  if(updateHash){try{history.replaceState(null,'','#'+id);}catch{}}
  resizeChapter(id);requestAnimationFrame(()=>resizeChapter(id));
  if(scroll)window.scrollTo({top:0,behavior:'instant'});
  if(focus)document.getElementById('chapter-tab-'+id).focus({preventScroll:true});
}
chapterButtons.forEach((button,index)=>{
  button.onclick=()=>selectChapter(button.dataset.chapter);
  button.onkeydown=event=>{let next=index;if(event.key==='ArrowRight'||event.key==='ArrowLeft')next=1-index;else if(event.key==='Home')next=0;else if(event.key==='End')next=1;else return;event.preventDefault();selectChapter(chapterIds[next],{focus:true});};
});
document.getElementById('chapter-previous').onclick=()=>{if(activeChapter==='agents')selectChapter('llm',{focus:true});};
document.getElementById('chapter-next').onclick=()=>{if(activeChapter==='llm')selectChapter('agents',{focus:true});};
chapterIds.forEach(id=>{
  const frame=chapterFrames[id];
  frame.addEventListener('load',()=>{
    const doc=frame.contentDocument;
    const main=doc?.querySelector('main');
    if(!main)return;
    const observer=new ResizeObserver(()=>resizeChapter(id));observer.observe(main);chapterObservers.push(observer);
    doc.addEventListener('click',event=>{const link=event.target.closest('a[data-chapter-link]');if(link){event.preventDefault();selectChapter(link.dataset.chapterLink,{focus:true});}});
    doc.fonts?.ready.then(()=>resizeChapter(id));
    resizeChapter(id);
  });
  // srcdoc chapters are separate documents: they do not inherit parent CSS.
  // Resolve against this page so local files and GitHub project URLs both work.
  const chapterDoc=new DOMParser().parseFromString(chapterSources[id],'text/html');
  chapterDoc.querySelectorAll('link[href*="fonts.googleapis.com"]').forEach(link=>link.remove());
  const sharedStyles=chapterDoc.createElement('link');
  sharedStyles.rel='stylesheet';
  sharedStyles.href=document.getElementById('shared-styles').href;
  chapterDoc.head.append(sharedStyles);
  chapterDoc.body.setAttribute('data-choice-controls','');
  chapterDoc.title=chapterDoc.title.replace(/ — an interactive guide/i,'');
  const presentation=chapterDoc.createElement('script');
  presentation.src=new URL('guide-layout.js',sharedStyles.href).href;
  chapterDoc.body.append(presentation);
  frame.srcdoc='<!doctype html>\n'+chapterDoc.documentElement.outerHTML;
});
window.addEventListener('resize',()=>resizeChapter(activeChapter));
window.addEventListener('hashchange',()=>selectChapter(location.hash.slice(1),{updateHash:false}));
selectChapter(location.hash==='#agents'?'agents':'llm',{scroll:false});
</script></body></html>
