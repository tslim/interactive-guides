/span>\u003cspan>→\u003c/span>\u003c/div>\u003cdiv class=\"box\">\u003csmall>Next token\u003c/small>\u003cspan class=\"mono\">blue / clear / …\u003c/span>\u003c/div>\u003c/div>\u003cfigcaption>\u003cspan class=\"mono\">Fig. 1\u003c/span>Repeated prediction can produce a full answer.\u003c/figcaption>\u003c/figure>\n\u003cnav class=\"tabs\" role=\"tablist\" aria-label=\"Guide views\">\u003cbutton role=\"tab\" id=\"tab-model\" aria-controls=\"model\" aria-selected=\"true\" tabindex=\"0\" data-tab=\"model\">1. The model\u003csmall>What is inside?\u003c/small>\u003c/button>\u003cbutton role=\"tab\" id=\"tab-training\" aria-controls=\"training\" aria-selected=\"false\" tabindex=\"-1\" data-tab=\"training\">2. Training\u003csmall>How does it learn?\u003c/small>\u003c/button>\u003cbutton role=\"tab\" id=\"tab-inference\" aria-controls=\"inference\" aria-selected=\"false\" tabindex=\"-1\" data-tab=\"inference\">3. Inference\u003csmall>How does it answer?\u003c/small>\u003c/button>\u003c/nav>\n\u003cnoscript>Enable JavaScript to use the guide. A Transformer combines token information with attention, then transforms each token with an FFN. Training uses prediction errors to update weights. Inference keeps weights fixed and generates one token at a time.\u003c/noscript>\n\u003csection class=\"panel\" id=\"model\" role=\"tabpanel\" aria-labelledby=\"tab-model\">\u003cdiv class=\"workspace\">\u003cdiv class=\"parts\" aria-label=\"Select a model component\">\u003cbutton data-part=\"tokens\" aria-pressed=\"false\">Text → tokens\u003csmall>Split text into IDs\u003c/small>\u003c/button>\u003cbutton data-part=\"embedding\" aria-pressed=\"false\">Embeddings\u003csmall>IDs → vectors\u003c/small>\u003c/button>\u003cdiv class=\"repeat\">\u003cspan class=\"repeat-label\">TRANSFORMER LAYER · repeat ↓\u003c/span>\u003cbutton data-part=\"attention\" aria-pressed=\"true\">Attention heads\u003csmall>Mix information across tokens\u003c/small>\u003c/button>\u003cbutton data-part=\"ffn\" aria-pressed=\"false\">FFN / MoE\u003csmall>Transform each token\u003c/small>\u003c/button>\u003c/div>\u003cbutton data-part=\"layers\" aria-pressed=\"false\">Layers + residuals\u003csmall>Refine the representation\u003c/small>\u003c/button>\u003cbutton data-part=\"output\" aria-pressed=\"false\">Output head\u003csmall>Vectors → probabilities\u003c/small>\u003c/button>\u003cbutton data-part=\"parameters\" aria-pressed=\"false\">Parameters\u003csmall>Depth, width and head layout\u003c/small>\u003c/button>\u003cbutton data-part=\"quantization\" aria-pressed=\"false\">Quantization\u003csmall>Same count, fewer bits\u003c/small>\u003c/button>\u003c/div>\u003cdiv class=\"detail\" id=\"model-detail\" aria-live=\"polite\">\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"panel\" id=\"training\" role=\"tabpanel\" aria-labelledby=\"tab-training\" hidden>\u003cdiv class=\"controls training-switch\" aria-label=\"Training phase\">\u003cbutton data-training-mode=\"pretraining\" aria-pressed=\"true\">Pretraining\u003c/button>\u003cbutton data-training-mode=\"posttraining\" aria-pressed=\"false\">Post-training · SFT / RLHF / more\u003c/button>\u003c/div>\u003cdiv id=\"pretraining-view\">\u003cdiv class=\"stepnav\" aria-label=\"Training steps\">\u003cbutton data-step=\"0\" aria-pressed=\"true\">1. Predict\u003c/button>\u003cbutton data-step=\"1\" aria-pressed=\"false\">2. Measure error\u003c/button>\u003cbutton data-step=\"2\" aria-pressed=\"false\">3. Backpropagate\u003c/button>\u003cbutton data-step=\"3\" aria-pressed=\"false\">4. Update\u003c/button>\u003c/div>\u003cdiv class=\"train-layout\">\u003cfigure class=\"stage\">\u003cdiv class=\"micro\">NEXT-TOKEN PRETRAINING · one toy batch\u003c/div>\u003cdiv id=\"train-picture\">\u003c/div>\u003cfigcaption id=\"train-caption\">\u003c/figcaption>\u003c/figure>\u003cdiv class=\"stage\">\u003ch2 id=\"train-title\">\u003c/h2>\u003cp id=\"train-text\">\u003c/p>\u003cdiv id=\"train-extra\">\u003c/div>\u003cdiv class=\"callout\">\u003cstrong>Training changes parameters.\u003c/strong>\u003cp class=\"muted\">Repeat over many batches. Instruction tuning then trains on desired responses, including tool requests. Preference training uses feedback to shape behavior.\u003c/p>\u003c/div>\u003cbutton id=\"open-posttraining\">How does it become an assistant? →\u003c/button>\u003cdiv class=\"step-footer\">\u003cbutton id=\"train-next\" class=\"primary\">Next step →\u003c/button>\u003cdiv class=\"progress\" aria-label=\"Step 1 of 4\" id=\"train-progress\">\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003c/div>\u003cdiv id=\"posttraining-view\" hidden>\u003cp class=\"post-intro\">Pretraining learns prediction. Post-training shapes responses. These methods can be alternatives or combined—not a required sequence.\u003c/p>\u003cdiv class=\"workspace\">\u003cdiv class=\"parts\" aria-label=\"Choose a post-training method\">\u003cbutton data-post-method=\"sft\" aria-pressed=\"true\">SFT\u003csmall>Learn from target responses\u003c/small>\u003c/button>\u003cbutton data-post-method=\"rlhf\" aria-pressed=\"false\">RLHF\u003csmall>Human feedback → reward\u003c/small>\u003c/button>\u003cbutton data-post-method=\"dpo\" aria-pressed=\"false\">DPO\u003csmall>Direct preference loss\u003c/small>\u003c/button>\u003cbutton data-post-method=\"rlaif\" aria-pressed=\"false\">RLAIF\u003csmall>AI feedback → reward\u003c/small>\u003c/button>\u003cbutton data-post-method=\"rlvr\" aria-pressed=\"false\">RLVR\u003csmall>Checkable outcomes → reward\u003c/small>\u003c/button>\u003c/div>\u003cdiv class=\"detail\" id=\"posttraining-detail\" aria-live=\"polite\">\u003c/div>\u003c/div>\u003cp class=\"post-endnote\">\u003cstrong>Training changes weights; RAG supplies context.\u003c/strong> Post-training can improve instruction following and tool requests. It does not guarantee correct or safe outputs, and it does not execute tools.\u003c/p>\u003cdetails>\u003csummary>Where do PPO, GRPO and synthetic data fit?\u003c/summary>\u003cp>PPO (proximal policy optimization) and GRPO (group relative policy optimization) are examples of reinforcement-learning update algorithms. They are not feedback sources or model architectures.\u003c/p>\u003cp>Synthetic data means examples or labels generated by software, often another model. It can supply SFT examples or preference data. It is a data source, not a separate training objective.\u003c/p>\u003cp>Fine-tuning can update all model weights or a smaller trainable subset, such as adapters trained with low-rank adaptation (LoRA). The training objective and the choice of trainable parameters are separate decisions.\u003c/p>\u003c/details>\u003c/div>\u003c/section>\n\u003csection class=\"panel\" id=\"inference\" role=\"tabpanel\" aria-labelledby=\"tab-inference\" hidden>\u003cdiv class=\"infer-layout\">\u003cfigure class=\"stage\">\u003cspan class=\"status\" id=\"infer-phase\">READY · weights fixed\u003c/span>\u003ch2>Read once. Then extend.\u003c/h2>\u003cdiv class=\"token-row infer-context\" id=\"infer-context\" aria-label=\"Current context\">\u003c/div>\u003cdiv class=\"cache-line\">\u003cdiv class=\"micro\">KEY–VALUE (KV) CACHE\u003c/div>\u003cp id=\"cache-text\" class=\"note\">\u003c/p>\u003c/div>\u003cdiv class=\"infer-buttons\">\u003cbutton id=\"infer-action\" class=\"primary\">Run prefill →\u003c/button>\u003cbutton id=\"infer-reset\">Reset\u003c/button>\u003c/div>\u003cfigcaption>\u003cspan class=\"mono\">Fig. 4\u003c/span>\u003cspan id=\"infer-caption\">Prefill processes all prompt tokens with causal attention.\u003c/span>\u003c/figcaption>\u003c/figure>\u003cdiv class=\"stage\">\u003cdiv class=\"controls\">\u003clabel for=\"temp\">Temperature \u003coutput id=\"temp-value\">1.0\u003c/output>\u003c/label>\u003c/div>\u003cinput id=\"temp\" type=\"range\" min=\"0.2\" max=\"2\" step=\"0.1\" value=\"1\" aria-label=\"Sampling temperature\">\u003cdiv class=\"micro\">LOWER: MORE CONCENTRATED · HIGHER: FLATTER\u003c/div>\u003cdiv id=\"infer-probs\" class=\"bars\" aria-live=\"polite\">\u003c/div>\u003cp id=\"infer-explanation\" class=\"note\">Run prefill to get the first next-token distribution.\u003c/p>\u003cdetails>\u003csummary>What the cache saves\u003c/summary>\u003cp>Each attention layer stores earlier key and value vectors. Decode computes the new token’s vectors and attends to the cached prefix. It still runs the model’s layers for the new token. The cache is not a store of finished answers. Weight quantization does not automatically reduce cache precision or cache size.\u003c/p>\u003c/details>\u003c/div>\u003c/div>\u003c/section>\n\u003cfooter>\u003cdiv>\u003cstrong>Scope:\u003c/strong> a typical decoder-only Transformer.\u003cbr>\u003cspan class=\"footer-note\">Illustrative tokens, weights, probabilities and model sizes. No live model.\u003c/span>\u003c/div>\u003cdiv>Read more\u003cbr>\u003ca href=\"https://arxiv.org/abs/1706.03762\" target=\"_blank\" rel=\"noopener\">Transformer\u003c/a>\u003ca href=\"https://arxiv.org/abs/2101.03961\" target=\"_blank\" rel=\"noopener\">Sparse MoE\u003c/a>\u003ca href=\"https://huggingface.co/docs/transformers/quantization/overview\" target=\"_blank\" rel=\"noopener\">Quantization\u003c/a>\u003ca href=\"https://huggingface.co/docs/transformers/cache_explanation\" target=\"_blank\" rel=\"noopener\">KV cache\u003c/a>\u003ca href=\"https://arxiv.org/abs/2203.02155\" target=\"_blank\" rel=\"noopener\">RLHF\u003c/a>\u003ca href=\"https://arxiv.org/abs/2305.18290\" target=\"_blank\" rel=\"noopener\">DPO\u003c/a>\u003c/div>\u003c/footer>\n\u003c/main>\u003cscript>\nconst \u0024=s=>document.querySelector(s), \u0024\u0024=s=>[...document.querySelectorAll(s)];\nconst tabs=\u0024\u0024('[data-tab]');function showTab(name){tabs.forEach(b=>{const on=b.dataset.tab===name;b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1;\u0024('#'+b.dataset.tab).hidden=!on;});}tabs.forEach((b,i)=>{b.onclick=()=>showTab(b.dataset.tab);b.onkeydown=e=>{let n=i;if(e.key==='ArrowRight')n=(i+1)%3;else if(e.key==='ArrowLeft')n=(i+2)%3;else if(e.key==='Home')n=0;else if(e.key==='End')n=2;else return;e.preventDefault();showTab(tabs[n].dataset.tab);tabs[n].focus();};});\nfunction bars(labels,values,blocked=[]){return '\u003cdiv class=\"bars\">'+labels.map((x,i)=>`\u003cdiv class=\"barrow \u0024{blocked.includes(i)?'blocked':''}\">\u003cspan>\u0024{x}\u003c/span>\u003cdiv class=\"track\">\u003cdiv class=\"fill\" style=\"--value:\u0024{values[i]*100}%\">\u003c/div>\u003c/div>\u003cspan>\u0024{blocked.includes(i)?'—':Math.round(values[i]*100)+'%'}\u003c/span>\u003c/div>`).join('')+'\u003c/div>';}\nfunction svg(content,label){return `\u003cdiv class=\"scroll\">\u003csvg class=\"drawing\" viewBox=\"0 0 560 220\" role=\"img\" aria-label=\"\u0024{label}\">\u0024{content}\u003c/svg>\u003c/div>`;}\nfunction node(x,y,w,h,title,sub='',cls=''){return `\u003crect class=\"\u0024{cls}\" x=\"\u0024{x}\" y=\"\u0024{y}\" width=\"\u0024{w}\" height=\"\u0024{h}\" rx=\"4\"/>\u003ctext x=\"\u0024{x+12}\" y=\"\u0024{y+26}\">\u0024{title}\u003c/text>\u0024{sub?`\u003ctext class=\"sub\" x=\"\u0024{x+12}\" y=\"\u0024{y+47}\">\u0024{sub}\u003c/text>`:''}`;}\nlet head=0,query=2,moe=false;\nconst attentionData=[[[1,0,0,0],[.7,.3,0,0],[.1,.75,.15,0],[.08,.55,.17,.2]],[[1,0,0,0],[.2,.8,0,0],[.1,.2,.7,0],[.05,.1,.65,.2]]];\nconst words=['The','sky','is','blue'];\nfunction attention(){return `\u003ch2>Heads read context in parallel.\u003c/h2>\u003cp class=\"intro\">Heads use learned query, key and value projections. Some models share key/value heads. Select a token and a head.\u003c/p>\u003cdiv class=\"controls\">\u003clabel for=\"query\">Query token\u003c/label>\u003cselect id=\"query\">\u0024{words.map((w,i)=>`\u003coption value=\"\u0024{i}\" \u0024{i===query?'selected':''}>\u0024{w}\u003c/option>`).join('')}\u003c/select>\u003cbutton data-head=\"0\" aria-pressed=\"\u0024{head===0}\">Head A\u003c/button>\u003cbutton data-head=\"1\" aria-pressed=\"\u0024{head===1}\">Head B\u003c/button>\u003c/div>\u003cfigure>\u003cdiv id=\"attn-bars\">\u0024{bars(words,attentionData[head][query],words.map((_,i)=>i).filter(i=>i>query))}\u003c/div>\u003cfigcaption>\u003cspan class=\"mono\">Fig. 2\u003c/span>\u003cstrong>\u0024{words[query]}\u003c/strong> can read itself and earlier tokens. Future tokens are masked.\u003c/figcaption>\u003c/figure>\u003cdiv class=\"smallgrid\">\u003cdiv>\u003cstrong>Q · Query\u003c/strong>\u003cspan>Compared with keys.\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>K · Key\u003c/strong>\u003cspan>Used to score a match.\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>V · Value\u003c/strong>\u003cspan>Information to combine.\u003c/span>\u003c/div>\u003c/div>\u003cdetails>\u003csummary>Attention math + head outputs\u003c/summary>\u003cp class=\"formula\">softmax(QKᵀ / √dₖ + causal mask)V\u003c/p>\u003cp>Softmax turns allowed scores into attention weights. A head returns a weighted sum of values. The model joins head outputs, then applies an output projection. These toy heads have no fixed linguistic roles.\u003c/p>\u003cp>Heads divide a layer’s attention width. More heads at the same total width need not add parameters.\u003c/p>\u003c/details>\u003cbutton class=\"size-jump\" data-part-link=\"parameters\">See heads vs. parameter count →\u003c/button>`;}\nfunction ffnDiagram(){if(!moe)return svg(`\u003cpath class=\"edge\" d=\"M115 106H186\"/>\u003ctext class=\"sub\" x=\"121\" y=\"90\">expand\u003c/text>\u003cpath class=\"edge\" d=\"M365 106H435\"/>\u003ctext class=\"sub\" x=\"373\" y=\"90\">project\u003c/text>\u0024{node(0,73,115,66,'Token x','one vector')}\u0024{node(190,59,175,94,'Dense FFN','nonlinearity','hot')}\u0024{node(440,73,118,66,'Update','same width')}\u003ctext class=\"sub\" x=\"190\" y=\"183\">Same network for every token\u003c/text>`,'A dense feed-forward network expands a token vector, applies a nonlinearity, and projects it back.');return svg(`\u003cpath class=\"edge hotedge\" d=\"M110 110H160V40H234\"/>\u003cpath class=\"edge idle\" d=\"M160 110V100H234\"/>\u003cpath class=\"edge hotedge\" d=\"M160 110V160H234\"/>\u003cpath class=\"edge hotedge\" d=\"M355 40H398V110H435\"/>\u003cpath class=\"edge hotedge\" d=\"M355 160H398V110\"/>\u003ctext class=\"sub\" x=\"164\" y=\"20\">route\u003c/text>\u003ctext class=\"sub\" x=\"412\" y=\"87\">combine\u003c/text>\u0024{node(0,77,110,66,'Router','token x')}\u0024{node(240,14,115,48,'Expert A','','hot')}\u0024{node(240,76,115,48,'Expert B','','idle')}\u0024{node(240,138,115,48,'Expert C','','hot')}\u0024{node(440,77,118,66,'Update','weighted sum')}\u003ctext class=\"sub\" x=\"240\" y=\"211\">A + C active · B skipped\u003c/text>`,'A learned router selects two of three expert feed-forward networks and combines their outputs.');}\nfunction ffn(){return `\u003ch2>\u0024{moe?'MoE selects a few expert networks.':'The FFN transforms each token.'}\u003c/h2>\u003cp class=\"intro\">Attention mixes tokens. A feed-forward network (FFN) transforms each token’s vector independently.\u003c/p>\u003cdiv class=\"controls\">\u003cbutton data-moe=\"false\" aria-pressed=\"\u0024{!moe}\">Dense FFN\u003c/button>\u003cbutton data-moe=\"true\" aria-pressed=\"\u0024{moe}\">Sparse MoE\u003c/button>\u003c/div>\u003cfigure>\u0024{ffnDiagram()}\u003cfigcaption>\u003cspan class=\"mono\">Fig. 2\u003c/span>\u0024{moe?'A mixture of experts (MoE) replaces some FFNs with routed expert FFNs.':'Learned matrices and a nonlinearity produce an update for each token.'}\u003c/figcaption>\u003c/figure>\u003cp class=\"note\">\u0024{moe?'More total parameters, with only a subset used per token. Experts still need memory. Routing adds communication cost. Expert names do not imply fixed topics.':'Modern FFNs often use a gate, such as SwiGLU. Unlike attention, this operation does not directly read other token positions.'}\u003c/p>\u003cdetails>\u003csummary>\u0024{moe?'What stays the same?':'A simple FFN'}\u003c/summary>\u003cp>\u0024{moe?'Tokens, attention, residual connections and next-token prediction remain. The number of selected experts and routing rules vary by model.':'FFN(x) = W₂ σ(W₁x + b₁) + b₂. The hidden width is often larger than the token vector width. Gated variants add another learned projection.'}\u003c/p>\u003c/details>`;}\n// A deliberately bounded, dense decoder model. No claim about a named checkpoint.\nconst sizeSettings={layers:32,width:4096,heads:32,gqa:false,bits:16};\nfunction parameterModel(s=sizeSettings){\n  const d=s.width,L=s.layers,H=s.heads,K=s.gqa?H/4:H,V=32000;\n  const headWidth=d/H,kvWidth=K*headWidth,ffnWidth=Math.ceil((8*d/3)/256)*256;\n  const attentionPerLayer=2*d*d+2*d*kvWidth,ffnPerLayer=3*d*ffnWidth;\n  const embeddings=V*d,norms=(2*L+1)*d;\n  const attention=L*attentionPerLayer,ffn=L*ffnPerLayer,total=embeddings+norms+attention+ffn;\n  return {d,L,H,K,V,headWidth,kvWidth,ffnWidth,attentionPerLayer,ffnPerLayer,embeddings,norms,attention,ffn,total,weightBytes:total*s.bits/8};\n}\nconst compactCount=n=>n>=1e9?(n/1e9).toFixed(2)+'B':(n/1e6).toFixed(1)+'M';\nconst gb=n=>(n/1e9).toFixed(2)+' GB';\nfunction sizeSelect(id,label,values,value){return `\u003clabel for=\"\u0024{id}\">\u0024{label}\u003cselect id=\"\u0024{id}\">\u0024{values.map(v=>`\u003coption value=\"\u0024{v}\" \u0024{v===value?'selected':''}>\u0024{v.toLocaleString('en-US')}\u003c/option>`).join('')}\u003c/select>\u003c/label>`;}\nfunction parameterView(){const p=parameterModel();return `\u003ch2>Layers hold parameters. Heads divide attention.\u003c/h2>\u003cp class=\"intro\">A parameter is one learned scalar, usually a matrix entry. Width sets matrix sizes; depth repeats the layer’s matrices.\u003c/p>\u003cdiv class=\"size-controls\">\u0024{sizeSelect('size-layers','Layers · depth',[16,32,48,64],p.L)}\u0024{sizeSelect('size-width','Vector width',[2048,4096,8192],p.d)}\u0024{sizeSelect('size-heads','Query heads per layer',[8,16,32,64],p.H)}\u003clabel for=\"size-gqa\">Key/value layout\u003cselect id=\"size-gqa\">\u003coption value=\"false\" \u0024{!sizeSettings.gqa?'selected':''}>MHA · one KV head per Q head\u003c/option>\u003coption value=\"true\" \u0024{sizeSettings.gqa?'selected':''}>GQA · four Q heads share KV\u003c/option>\u003c/select>\u003c/label>\u003c/div>\u003cfigure>\u003cdiv class=\"size-total\">\u003cspan class=\"micro\">ILLUSTRATIVE DENSE MODEL\u003c/span>\u003cstrong id=\"parameter-total\" data-count=\"\u0024{p.total}\">\u0024{compactCount(p.total)} parameters\u003c/strong>\u003c/div>\u003cdiv class=\"size-bars\" role=\"img\" aria-label=\"\u0024{compactCount(p.total)} parameters: \u0024{compactCount(p.ffn)} in FFNs, \u0024{compactCount(p.attention)} in attention, \u0024{compactCount(p.embeddings+p.norms)} in embeddings and norms.\">\u0024{[['FFNs',p.ffn],['Attention',p.attention],['Embedding + norm',p.embeddings+p.norms]].map(([name,n])=>`\u003cdiv class=\"size-barrow\">\u003cspan>\u0024{name}\u003c/span>\u003cdiv class=\"track\">\u003cdiv class=\"fill\" style=\"--value:\u0024{n/p.total*100}%\">\u003c/div>\u003c/div>\u003cspan>\u0024{compactCount(n)}\u003c/span>\u003c/div>`).join('')}\u003c/div>\u003cfigcaption>\u003cspan class=\"mono\">Fig. 2\u003c/span>More layers add parameters linearly. Greater width grows layer matrices roughly quadratically here.\u003c/figcaption>\u003c/figure>\u003cfigure class=\"head-figure\">\u003cdiv class=\"micro\">ONE LAYER’S QUERY WIDTH · split across heads\u003c/div>\u003cdiv class=\"head-partition\" style=\"--heads:\u0024{p.H}\" role=\"img\" aria-label=\"\u0024{p.H} query heads of width \u0024{p.headWidth}, totaling width \u0024{p.d}.\">\u0024{Array.from({length:p.H},()=>'\u003cspan>\u003c/span>').join('')}\u003c/div>\u003cdiv class=\"head-equation\">\u0024{p.H} heads × \u0024{p.headWidth} values = \u0024{p.d.toLocaleString('en-US')} total width\u003c/div>\u003cfigcaption>\u0024{sizeSettings.gqa?`\u0024{p.K} KV heads serve \u0024{p.H} query heads. This GQA setting uses fewer K/V projection parameters and a smaller KV cache than MHA.`:'Standard multi-head attention (MHA): change the head count at fixed width. The projection parameter count stays the same.'}\u003c/figcaption>\u003c/figure>\u003cp class=\"note\">Try doubling depth, then width. Heads are not extra layers. Parameter count alone does not determine model quality.\u003c/p>\u003cdetails>\u003csummary>Counting rule + assumptions\u003c/summary>\u003cp class=\"formula\">P = Vd + L(2d² + 2d·dKV + 3dm + 2d) + d\u003c/p>\u003cp>d = vector width; L = layers; V = vocabulary size; m = gated FFN width. dKV = KV heads × head width. Attention contributes 2d² + 2d·dKV per layer; the gated FFN contributes 3dm.\u003c/p>\u003cp>This calculator uses a vocabulary of \u0024{p.V.toLocaleString('en-US')}, a gated FFN width of \u0024{p.ffnWidth.toLocaleString('en-US')}, two RMSNorm scales per layer and one final RMSNorm. It omits biases and uses tied input/output embeddings, counted once. FFN width is about 8d/3, rounded up to a multiple of 256.\u003c/p>\u003cp>GQA means grouped-query attention. Here, four query heads share each KV head. Changing query-head count preserves that ratio, so the projection parameter count stays fixed. Other designs can change the count.\u003c/p>\u003cp>This is a dense model, not MoE. An MoE count must include all stored expert weights and routers, even when a token uses only some experts.\u003c/p>\u003c/details>\u003cbutton class=\"size-jump\" data-part-link=\"quantization\">Compare weight precision →\u003c/button>`;}\nfunction quantizationView(){const p=parameterModel(),bits=sizeSettings.bits;const rows=[16,8,4];return `\u003ch2>Quantization changes bits, not parameter count.\u003c/h2>\u003cp class=\"intro\">Store approximate weights with fewer bits. The model keeps its layers, heads and number of weights—not their exact original values.\u003c/p>\u003cdiv class=\"controls\" aria-label=\"Weight precision\">\u0024{rows.map(b=>`\u003cbutton data-bits=\"\u0024{b}\" aria-pressed=\"\u0024{b===bits}\">\u0024{b===16?'16-bit float':b+'-bit quantized'}\u003c/button>`).join('')}\u003c/div>\u003cfigure>\u003cdiv class=\"size-total\">\u003cspan class=\"micro\">SAME \u0024{compactCount(p.total)} PARAMETERS · CURRENT ARCHITECTURE SETTINGS\u003c/span>\u003cstrong id=\"weight-storage\" data-bytes=\"\u0024{p.weightBytes}\">\u0024{gb(p.weightBytes)} ideal weight storage\u003c/strong>\u003c/div>\u003cdiv class=\"size-bars storage-bars\" role=\"img\" aria-label=\"Ideal storage: \u0024{rows.map(b=>b+' bit '+gb(p.total*b/8)).join(', ')}. Selected \u0024{bits} bit.\">\u0024{rows.map(b=>`\u003cdiv class=\"size-barrow \u0024{b===bits?'selected':''}\">\u003cspan>\u0024{b}-bit\u0024{b===bits?' ←':''}\u003c/span>\u003cdiv class=\"track\">\u003cdiv class=\"fill\" style=\"--value:\u0024{b/16*100}%\">\u003c/div>\u003c/div>\u003cspan>\u0024{gb(p.total*b/8)}\u003c/span>\u003c/div>`).join('')}\u003c/div>\u003cfigcaption>\u003cspan class=\"mono\">Fig. 2\u003c/span>Same parameter count × fewer bits per weight = less storage.\u003c/figcaption>\u003c/figure>\u003cdiv class=\"bit-example\">\u003cspan class=\"micro\">BITS PER STORED WEIGHT · idealized payload\u003c/span>\u003cdiv class=\"bit-strip\" role=\"img\" aria-label=\"\u0024{bits} bits per weight out of a 16-bit baseline.\">\u0024{Array.from({length:16},(_,i)=>`\u003cspan class=\"\u0024{i\u003cbits?'used':''}\">\u003c/span>`).join('')}\u003c/div>\u003cspan class=\"mono\">\u0024{bits} / 16 bits\u0024{bits\u003c16?' · '+(bits===8?'½':'¼')+' of the 16-bit payload':''}\u003c/span>\u003c/div>\u003cdiv class=\"smallgrid\">\u003cdiv>\u003cstrong>Unchanged\u003c/strong>\u003cspan>Weight count, layer count, head layout\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>Changed\u003c/strong>\u003cspan>Numerical precision and stored values\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>Trade-off\u003c/strong>\u003cspan>Less memory; possible quality loss\u003c/span>\u003c/div>\u003c/div>\u003cp class=\"note\">This is not total GPU memory. Add quantization metadata, higher-precision tensors, the KV cache, activations and runtime workspace. Lower bit width does not guarantee faster execution.\u003c/p>\u003cdetails>\u003csummary>Formula, inference and training\u003c/summary>\u003cp class=\"formula\">Ideal weight bytes = parameters × bits / 8\u003c/p>\u003cp>GB is decimal: 10⁹ bytes. Bars assume every weight uses the selected bit width, with no packing overhead. Real formats often keep some tensors at higher precision and store scales or other metadata.\u003c/p>\u003cp>Quantization maps weights to a limited set of values, often using a scale for each group. Runtime kernels use or reconstruct approximations. Compute precision can differ from storage precision.\u003c/p>\u003cp>Weight quantization does not automatically quantize the KV cache. Longer context and larger batches can still increase memory use.\u003c/p>\u003cp>Post-training quantization converts a trained model, often with calibration. Quantization-aware training accounts for rounding during training. Neither is the same as deleting parameters through pruning.\u003c/p>\u003c/details>\u003cbutton class=\"size-jump\" data-part-link=\"parameters\">Change layers, width or heads →\u003c/button>`;}\nfunction bindSizeControls(part){\n  for(const key of ['layers','width','heads']){const input=document.querySelector('#size-'+key);if(input)input.onchange=()=>{sizeSettings[key]=+input.value;renderPart(part);document.querySelector('#size-'+key).focus();};}\n  const gqa=document.querySelector('#size-gqa');if(gqa)gqa.onchange=()=>{sizeSettings.gqa=gqa.value==='true';renderPart(part);document.querySelector('#size-gqa').focus();};\n  document.querySelectorAll('[data-bits]').forEach(b=>b.onclick=()=>{sizeSettings.bits=+b.dataset.bits;renderPart('quantization');document.querySelector('[data-bits=\"'+sizeSettings.bits+'\"]').focus();});\n  document.querySelectorAll('[data-part-link]').forEach(b=>b.onclick=()=>{const target=b.dataset.partLink;renderPart(target);document.querySelector('[data-part=\"'+target+'\"]').focus();});\n}\n\nconst content={\nparameters:parameterView,\nquantization:quantizationView,\ntokens:()=>`\u003ch2>Tokens are pieces of text.\u003c/h2>\u003cp class=\"intro\">A tokenizer maps text pieces to vocabulary IDs. A token can be a word, part of a word, or punctuation.\u003c/p>\u003cfigure>\u003cdiv class=\"token-row\">\u003cspan class=\"token\">un\u003csmall>ID 314\u003c/small>\u003c/span>\u003cspan class=\"token\">believ\u003csmall>ID 842\u003c/small>\u003c/span>\u003cspan class=\"token\">able\u003csmall>ID 71\u003c/small>\u003c/span>\u003cspan class=\"token\">!\u003csmall>ID 9\u003c/small>\u003c/span>\u003c/div>\u003cfigcaption>\u003cspan class=\"mono\">Fig. 2\u003c/span>“unbelievable!” becomes a sequence of IDs in this toy tokenizer.\u003c/figcaption>\u003c/figure>\u003cp class=\"note\">Real splits and IDs depend on the tokenizer. The model predicts token IDs, not whole sentences.\u003c/p>`,\nembedding:()=>`\u003ch2>IDs become learned vectors.\u003c/h2>\u003cp class=\"intro\">An embedding table maps each token ID to a vector of numbers. The model also needs position information.\u003c/p>\u003cfigure>\u0024{svg(`\u003cpath class=\"edge\" d=\"M110 110H202\"/>\u003ctext class=\"sub\" x=\"123\" y=\"90\">look up\u003c/text>\u003cpath class=\"edge\" d=\"M355 110H436\"/>\u003ctext class=\"sub\" x=\"368\" y=\"90\">return\u003c/text>\u0024{node(0,77,110,66,'ID 842','a token')}\u0024{node(208,59,147,102,'Embedding','learned table','hot')}\u0024{node(442,77,116,66,'Vector x','[.2, −.4, …]')}\u003ctext class=\"sub\" x=\"120\" y=\"201\">Position: often added through rotary Q/K transforms\u003c/text>`,'A token ID looks up a learned embedding vector. Position information is also provided, often via rotary query and key transforms.')}\u003cfigcaption>\u003cspan class=\"mono\">Fig. 2\u003c/span>Vectors carry numerical features, not explicit dictionary definitions.\u003c/figcaption>\u003c/figure>\u003cp class=\"note\">Many current models use rotary position embeddings (RoPE) in attention. Other models add position vectors to token embeddings.\u003c/p>\u003cdetails>\u003csummary>Token embeddings vs. retrieval embeddings\u003c/summary>\u003cfigure>\u003cdiv class=\"smallgrid\" style=\"grid-template-columns:repeat(2,minmax(0,1fr))\">\u003cdiv>\u003cstrong>Token embeddings · inside the LLM\u003c/strong>\u003cspan>Token ID → learned vector → Transformer layers\u003c/span>\u003c/div>\u003cdiv>\u003cstrong>Retrieval embeddings · search\u003c/strong>\u003cspan>Query or passage → encoder → vector for similarity search\u003c/span>\u003c/div>\u003c/div>\u003cfigcaption>Both use vectors, but they serve different purposes. A search embedding is not a token-table lookup.\u003c/figcaption>\u003c/figure>\u003cp>Retrieval often uses a separate embedding model. Query and passage vectors must use compatible encoders. The selected passage text usually enters the generative LLM’s context—not the search vectors themselves.\u003c/p>\u003c/details>`,\nattention,ffn,\nlayers:()=>`\u003ch2>Each layer refines the vectors.\u003c/h2>\u003cp class=\"intro\">A layer contains attention and an FFN. Each layer has its own learned weights; heads run in parallel inside attention.\u003c/p>\u003cfigure>\u0024{svg(`\u003cpath class=\"edge\" d=\"M20 110H64\"/>\u003cpath class=\"edge\" d=\"M211 110H260\"/>\u003cpath class=\"edge\" d=\"M405 110H455\"/>\u003cpath class=\"edge\" d=\"M516 110H555\"/>\u003cpath class=\"edge\" d=\"M25 110V25H235V105\"/>\u003cpath class=\"edge\" d=\"M245 110V190H430V115\"/>\u003ctext class=\"sub\" x=\"60\" y=\"17\">add original x\u003c/text>\u003ctext class=\"sub\" x=\"286\" y=\"213\">add current x\u003c/text>\u0024{node(70,76,141,68,'Norm → Attn','parallel heads','hot')}\u003ccircle cx=\"236\" cy=\"110\" r=\"13\"/>\u003ctext x=\"230\" y=\"116\">+\u003c/text>\u0024{node(266,76,139,68,'Norm → FFN','or MoE')}\u003ccircle cx=\"431\" cy=\"110\" r=\"13\"/>\u003ctext x=\"425\" y=\"116\">+\u003c/text>\u0024{node(461,76,57,68,'x′')}\u003ctext class=\"sub\" x=\"443\" y=\"160\">next layer →\u003c/text>`,'A pre-normalized Transformer layer uses residual additions around attention and the FFN, then sends the updated vectors into the next layer.')}\u003cfigcaption>\u003cspan class=\"mono\">Fig. 2\u003c/span>Residual paths add updates to the current vectors. Normalization controls their scale.\u003c/figcaption>\u003c/figure>\u003cp class=\"note\">The layer stack runs in sequence. More layers add new sets of parameters; greater width enlarges their matrices. This is a common pre-norm layout.\u003c/p>`,\noutput:()=>`\u003ch2>The output head scores the vocabulary.\u003c/h2>\u003cp class=\"intro\">After final normalization, a learned projection maps the final token vector to one score (logit) per vocabulary token.\u003c/p>\u003cfigure>\u0024{bars(['blue','clear','dark','other'],[.6,.25,.1,.05])}\u003cfigcaption>\u003cspan class=\"mono\">Fig. 2\u003c/span>Softmax turns logits into probabilities. A selection rule chooses the next token.\u003c/figcaption>\u003c/figure>\u003cp class=\"note\">The output head is not an attention head. During generation, append the selected token and run the next step. Try this in the Inference view.\u003c/p>\u003cdetails>\u003csummary>Probability does not mean truth\u003c/summary>\u003cp>The distribution estimates likely continuations from learned patterns and the current context. A likely continuation can still be wrong.\u003c/p>\u003c/details>`};\nfunction renderPart(part){\u0024\u0024('[data-part]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.part===part));\u0024('#model-detail').innerHTML=content[part]();bindSizeControls(part);const q=\u0024('#query');if(q)q.onchange=e=>{query=+e.target.value;renderPart('attention');\u0024('#query').focus();};\u0024\u0024('[data-head]').forEach(b=>b.onclick=()=>{head=+b.dataset.head;renderPart('attention');\u0024(`[data-head=\"\u0024{head}\"]`).focus();});\u0024\u0024('[data-moe]').forEach(b=>b.onclick=()=>{moe=b.dataset.moe==='true';renderPart('ffn');\u0024(`[data-moe=\"\u0024{moe}\"]`).focus();});}\n\u0024\u0024('[data-part]').forEach(b=>b.onclick=()=>renderPart(b.dataset.part));renderPart('attention');\nconst postMethods={\n  sft:{name:'SFT',title:'Instruction tuning learns desired responses.',intro:'Supervised fine-tuning (SFT) trains on examples of what the assistant should say or request. Targets can include structured tool calls.',nodes:[['Chat example','User: “Read issue #42.”'],['Target response','Tool call: issues.get(id: 42)'],['Update assistant','Next-token loss on target tokens']],verbs:['supply target','train'],caption:'The desired response is the training target—not a reward score.',example:'A dataset can include user, assistant and tool messages. The assistant learns which response tokens to produce in that context.',caution:'Good examples help instruction following. They do not grant tool access or guarantee correct answers.'},\n  rlhf:{name:'RLHF',title:'RLHF learns from human preferences.',intro:'Reinforcement learning from human feedback (RLHF) often uses a learned reward model. Humans compare responses; the reward model learns to score them.',nodes:[['Human comparisons','Prefer response B over A'],['Reward model','Learn to score new responses'],['RL update','Generate, score, update assistant']],verbs:['train scorer','supply rewards'],caption:'The reward model scores responses; reinforcement learning updates the assistant’s policy.',example:'The policy is the assistant model’s distribution over possible responses. Reward scores guide updates; they are not target sentences.',caution:'A high learned reward is not proof of truth or safety. The assistant can exploit weaknesses in the reward model.'},\n  dpo:{name:'DPO',title:'DPO learns directly from preferred pairs.',intro:'Direct preference optimization (DPO) uses a preferred and a rejected response for the same prompt. A direct loss updates the assistant.',nodes:[['Preference pairs','Prompt + chosen / rejected'],['Direct objective','Compare relative likelihoods'],['Update assistant','Backpropagate preference loss']],verbs:['compute loss','train'],caption:'Unlike the common RLHF pipeline, standard DPO does not train a separate reward model.',example:'Common DPO compares the assistant with a fixed reference model. It does not need an online reinforcement-learning rollout loop.',caution:'Pair quality still matters. Preferences can favor a persuasive answer over a correct one.'},\n  rlaif:{name:'RLAIF',title:'RLAIF uses AI-generated feedback.',intro:'Reinforcement learning from AI feedback (RLAIF) changes the source of feedback. AI judgments can replace or supplement human labels.',nodes:[['AI judge','Assess responses using criteria'],['Reward signal','Directly or via a reward model'],['RL update','Train the assistant on rewards']],verbs:['provide feedback','guide updates'],caption:'Feedback source and update method are separate choices.',example:'AI-generated preference pairs can also train DPO. That is a separate optimization path—not a new model architecture.',caution:'An AI judge can share the assistant’s errors or biases. Its feedback still needs evaluation.'},\n  rlvr:{name:'RLVR',title:'RLVR rewards checkable outcomes.',intro:'Reinforcement learning with verifiable rewards (RLVR) uses programmatic checks, such as tests or a known-answer check, to score outputs.',nodes:[['Generated solution','Code patch or math answer'],['Verifier','Run tests or check the answer'],['RL update','Use the resulting reward']],verbs:['check result','supply reward'],caption:'A verifier supplies the reward instead of a learned preference scorer.',example:'Passing tests provides a training signal. It does not prove that the code has no bugs or that every requirement is met.',caution:'The model can exploit an incomplete verifier. Not every useful task has a reliable automatic check.'}\n};\nlet postMethod='sft';\nfunction showTrainingMode(mode){\n  document.querySelector('#pretraining-view').hidden=mode!=='pretraining';\n  document.querySelector('#posttraining-view').hidden=mode!=='posttraining';\n  document.querySelectorAll('[data-training-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.trainingMode===mode));\n}\nfunction renderPostTraining(){\n  const m=postMethods[postMethod];\n  document.querySelectorAll('[data-post-method]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.postMethod===postMethod));\n  document.querySelector('#posttraining-detail').innerHTML=`\u003ch2>\u0024{m.title}\u003c/h2>\u003cp class=\"intro\">\u0024{m.intro}\u003c/p>\u003cfigure>\u003cdiv class=\"post-flow\" role=\"img\" aria-label=\"\u0024{m.nodes.map(n=>n.join(': ')).join('; ')}\">\u0024{m.nodes.map((n,i)=>`\u0024{i?'\u003cdiv class=\"post-edge\">\u003cspan>'+m.verbs[i-1]+'\u003c/span>\u003cspan aria-hidden=\"true\">→\u003c/span>\u003c/div>':''}\u003cdiv class=\"post-node \u0024{i===2?'is-update':''}\">\u003cstrong>\u0024{n[0]}\u003c/strong>\u003cspan>\u0024{n[1]}\u003c/span>\u003c/div>`).join('')}\u003c/div>\u003cfigcaption>\u003cspan class=\"mono\">Fig. 3b\u003c/span>\u0024{m.caption}\u003c/figcaption>\u003c/figure>\u003cp class=\"note\">\u0024{m.example}\u003c/p>\u003cdiv class=\"callout\">\u003cstrong>Important limit\u003c/strong>\u003cp class=\"muted\">\u0024{m.caution}\u003c/p>\u003c/div>`;\n}\ndocument.querySelectorAll('[data-training-mode]').forEach(b=>b.onclick=()=>showTrainingMode(b.dataset.trainingMode));\ndocument.querySelectorAll('[data-post-method]').forEach(b=>b.onclick=()=>{postMethod=b.dataset.postMethod;renderPostTraining();});\ndocument.querySelector('#open-posttraining').onclick=()=>{showTrainingMode('posttraining');document.querySelector('[data-training-mode=\"posttraining\"]').focus();};\nrenderPostTraining();\n\nlet step=0;const trainTitles=['Predict the next token at every position.','Compare predictions with real text.','Trace the error back through the model.','Adjust weights, then repeat.'];const trainTexts=['Feed a batch of text through the model. Each position predicts the next token from the real prefix. Causal masking blocks future tokens.','Cross-entropy loss penalizes low probability on the correct next token. Training averages this loss across selected tokens in the batch.','Backpropagation computes loss gradients: how each trainable parameter affects the error. It does not change the weights yet.','An optimizer, such as AdamW, uses gradients to update trainable weights. The next batch uses those updated weights.'];\nfunction renderTraining(){ \u0024\u0024('[data-step]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.step===step));\u0024('#train-title').textContent=trainTitles[step];\u0024('#train-text').textContent=trainTexts[step];\u0024('#train-extra').innerHTML=step===0?'\u003cp class=\"note\">Training evaluates many positions in parallel. It does not feed its sampled guesses into this training sequence.\u003c/p>':step===1?'\u003cdiv class=\"formula\">loss = −log P(correct next token)\u003c/div>\u003cp class=\"note\">A correct token with higher probability gives lower loss.\u003c/p>':step===2?'\u003cdiv class=\"formula\">gradient = ∂loss / ∂weight\u003c/div>\u003cp class=\"note\">Gradients flow through the output head, layers and embeddings.\u003c/p>':'\u003cdiv class=\"formula\">Simple SGD: w ← w − η · gradient\u003c/div>\u003cp class=\"note\">η is the learning rate. This simple rule illustrates the update; AdamW also tracks gradient statistics.\u003c/p>';\nlet picture='',caption='';if(step===0){picture='\u003cdiv class=\"aligned\">'+['The','sky','is','blue'].map((w,i)=>`\u003cdiv>\u003cdiv class=\"token\">\u0024{w}\u003c/div>\u003cdiv class=\"down\">predict ↓\u003c/div>\u003cdiv class=\"token active\">\u0024{['sky','is','blue','.'][i]}\u003c/div>\u003c/div>`).join('')+'\u003c/div>\u003cp class=\"note\">Top: input tokens · Bottom: correct next-token targets.\u003c/p>';caption='One forward pass predicts all shifted targets, without reading future tokens.';}if(step===1){picture='\u003ch2>Target: “blue”\u003c/h2>'+bars(['blue','clear','dark'],[.2,.5,.3])+'\u003cp class=\"lossmark\">P(blue)
